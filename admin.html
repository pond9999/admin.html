<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <title>Admin Dashboard - ข้อมูลติดต่อ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #f5f5f7;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .glass-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.04);
            padding: 32px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1d1d1f;
        }

        .refresh-btn {
            background: #0071e3;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: #0077ed;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 14px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #86868b;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            text-transform: uppercase;
        }

        td {
            padding: 16px;
            font-size: 15px;
            color: #1d1d1f;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #86868b;
            font-size: 15px;
        }
    </style>
</head>
